<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VisiaLink — Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1efe8;color:#1c2e2b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;text-align:center;padding:24px}
  .box{max-width:360px}
  img{width:96px;height:96px;border-radius:20px;margin-bottom:20px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#4a5a56;line-height:1.5;margin:0 0 20px}
  button{background:#1c2e2b;color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="VisiaLink" />
  <h1>Nessuna connessione</h1>
  <p>Per prenotare o gestire una visita serve una connessione internet. Riprova quando sei di nuovo online.</p>
  <button onclick="location.reload()">Riprova</button>
</div>
</body>
</html>
